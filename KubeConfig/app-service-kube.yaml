apiVersion: v1
kind: Service
metadata:
  name: app-service-gateway
  namespace: microservices
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30001
---
apiVersion: v1
kind: Service
metadata:
  name: app-service-movie
  namespace: microservices
spec:
  type: NodePort
  selector:
    app: movie
  ports:
    - protocol: TCP
      port: 5004
      targetPort: 5004
